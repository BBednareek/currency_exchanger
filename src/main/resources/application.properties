spring.application.name=CurrencyExchanger
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false
spring.flyway.validate-migration-naming=true
frankfurter.base-url=https://api.frankfurter.dev/v2
frankfurter.connect-timeout=2s
frankfurter.read-timeout=3s
reference-rate.cache.time-to-live=1h
reference-rate.cache.maximum-fallback-age=168h
security.password.bcrypt-strength=${PASSWORD_BCRYPT_STRENGTH:12}
frankfurter.maximum-effective-date-age-days=7
security.authentication-attempts.maximum-failures=${AUTH_MAXIMUM_FAILURES:5}
security.authentication-attempts.failure-window=${AUTH_FAILURE_WINDOW:15m}
security.authentication-attempts.block-duration=${AUTH_BLOCK_DURATION:15m}
security.authentication-attempts.retention=${AUTH_ATTEMPT_RETENTION:168h}
security.authentication-attempts.cleanup-interval=${AUTH_ATTEMPT_CLEANUP_INTERVAL:1h}
